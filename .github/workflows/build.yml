name: Build .tipa

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build FloatBar .tipa
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make xz

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Download iOS SDK (sparse-checkout)
        run: |
          cd "$THEOS"
          rm -rf sdks
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout init --cone
          git sparse-checkout set iPhoneOS16.5.sdk
          git checkout
          ls -d iPhoneOS16.5.sdk

      - name: Build
        run: |
          export THEOS="$THEOS"
          make clean || true
          make package FINALPACKAGE=1
          ls -la packages/

      - name: Create .tipa
        run: |
          mkdir -p dist
          DEB=$(ls packages/*.deb | head -1)
          echo "Found: $DEB"
          mkdir -p /tmp/unpack
          dpkg-deb -x "$DEB" /tmp/unpack
          mkdir -p /tmp/tipa/Payload
          APP_DIR=$(find /tmp/unpack -name "*.app" -type d | head -1)
          cp -R "$APP_DIR" /tmp/tipa/Payload/
          cd /tmp/tipa
          zip -r "$GITHUB_WORKSPACE/dist/FloatBar.tipa" Payload
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Upload .tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatBar-tipa
          path: dist/FloatBar.tipa
          if-no-files-found: error

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FloatBar.tipa
          generate_release_notes: true
