<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e8f0fa"/>
      <stop offset="100%" stop-color="#c8d8ec"/>
    </radialGradient>

    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2f3a"/>
      <stop offset="100%" stop-color="#15181f"/>
    </linearGradient>

    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#dde5f0"/>
    </linearGradient>

    <linearGradient id="pill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4150"/>
      <stop offset="100%" stop-color="#1a1e28"/>
    </linearGradient>

    <!-- Flash glow around the camera button and the ClearShot image on screen -->
    <radialGradient id="flashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5c2" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffd84a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffb800" stop-opacity="0"/>
    </radialGradient>

    <!-- Camera body for the embedded ClearShot image -->
    <linearGradient id="camBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f4652"/>
      <stop offset="100%" stop-color="#1e232d"/>
    </linearGradient>

    <radialGradient id="lens" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8ec5ff"/>
      <stop offset="40%" stop-color="#2d6bbd"/>
      <stop offset="100%" stop-color="#0a1f3d"/>
    </radialGradient>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- Phone -->
  <g transform="translate(512 512) rotate(-6) translate(-290 -430)">
    <rect x="0" y="0" width="580" height="860" rx="84" ry="84" fill="url(#phone)" stroke="#000" stroke-width="3"/>
    <rect x="26" y="26" width="528" height="808" rx="62" ry="62" fill="url(#screen)"/>
    <rect x="220" y="46" width="140" height="34" rx="17" ry="17" fill="#0a0a0a"/>

    <!-- Embedded ClearShot icon on the screen: camera + prohibition + flash,
         centered in the screen area (screen bounds roughly 26..554 × 80..830). -->
    <g transform="translate(290 420) scale(0.45) translate(-512 -512)">
      <!-- Flash halo -->
      <circle cx="512" cy="430" r="340" fill="url(#flashGlow)"/>
      <!-- Flash rays -->
      <g fill="#ffb800" opacity="0.55">
        <polygon points="512,100 540,420 484,420"/>
        <polygon points="924,430 580,440 580,420"/>
        <polygon points="100,430 440,440 440,420"/>
        <polygon points="820,140 560,400 538,380"/>
        <polygon points="204,140 464,400 486,380"/>
      </g>
      <!-- Prohibition ring + slash -->
      <circle cx="512" cy="512" r="380" fill="none" stroke="#e02020" stroke-width="46" opacity="0.95"/>
      <line x1="245" y1="245" x2="779" y2="779" stroke="#e02020" stroke-width="46" stroke-linecap="round" opacity="0.95"/>
      <!-- Mini camera body -->
      <rect x="296" y="528" width="432" height="300" rx="36" ry="36" fill="url(#camBody)" stroke="#0a0a0a" stroke-width="4"/>
      <rect x="432" y="492" width="160" height="60" rx="14" ry="14" fill="#2a2f38" stroke="#0a0a0a" stroke-width="3"/>
      <rect x="620" y="508" width="48" height="34" rx="6" ry="6" fill="#f0e0a0"/>
      <!-- Lens -->
      <circle cx="512" cy="678" r="118" fill="#101010" stroke="#2a2a2a" stroke-width="6"/>
      <circle cx="512" cy="678" r="96" fill="url(#lens)"/>
      <circle cx="512" cy="678" r="72" fill="#061127" stroke="#4080c0" stroke-width="3"/>
      <ellipse cx="482" cy="648" rx="22" ry="12" fill="#ffffff" opacity="0.75"/>
      <!-- Lightning bolt -->
      <polygon points="486,196 568,196 528,364 606,364 464,580 504,420 426,420"
               fill="#ffd84a" stroke="#8a6500" stroke-width="10" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Flash glow highlighting the camera button (leftmost) -->
  <circle cx="278" cy="770" r="110" fill="url(#flashGlow)"/>

  <!-- Floating pill - 4 buttons in order: camera, home, app switcher, back -->
  <g filter="url(#pillShadow)">
    <rect x="200" y="700" width="624" height="140" rx="70" ry="70" fill="url(#pill)" stroke="#000" stroke-width="3"/>

    <line x1="356" y1="738" x2="356" y2="802" stroke="#4a5262" stroke-width="2" opacity="0.5"/>
    <line x1="512" y1="738" x2="512" y2="802" stroke="#4a5262" stroke-width="2" opacity="0.5"/>
    <line x1="668" y1="738" x2="668" y2="802" stroke="#4a5262" stroke-width="2" opacity="0.5"/>

    <!-- Button 1 (LEFT): Camera -->
    <g transform="translate(278 770)">
      <rect x="-32" y="-16" width="64" height="40" rx="6" ry="6" fill="#ffffff"/>
      <rect x="-10" y="-22" width="20" height="8" rx="3" ry="3" fill="#ffffff"/>
      <circle cx="0" cy="4" r="10" fill="#1a1e28"/>
      <circle cx="0" cy="4" r="5" fill="#8ec5ff"/>
      <rect x="18" y="-12" width="8" height="5" rx="1" ry="1" fill="#ffd84a"/>
    </g>

    <!-- Button 2: Home -->
    <g transform="translate(434 770)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ffffff" stroke-width="5"/>
      <circle cx="0" cy="0" r="10" fill="#ffffff"/>
    </g>

    <!-- Button 3: App switcher -->
    <g transform="translate(590 770)">
      <rect x="-26" y="-22" width="52" height="8" rx="4" fill="#ffffff"/>
      <rect x="-26" y="-4" width="52" height="8" rx="4" fill="#ffffff"/>
      <rect x="-26" y="14" width="52" height="8" rx="4" fill="#ffffff"/>
    </g>

    <!-- Button 4 (RIGHT): Back arrow -->
    <g transform="translate(746 770)">
      <polyline points="-24,0 -10,-20 -10,-7 24,-7 24,7 -10,7 -10,20"
                fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
