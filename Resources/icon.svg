<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1b1f3a"/>
      <stop offset="45%" stop-color="#2a1e52"/>
      <stop offset="100%" stop-color="#4a1f70"/>
    </linearGradient>
    <radialGradient id="shine" cx="40%" cy="20%" r="60%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gearFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f5f5fa"/>
      <stop offset="100%" stop-color="#c8c8d8"/>
    </linearGradient>
    <linearGradient id="gearFill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#9ea5c0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#shine)"/>

  <!-- Big gear, centered-right -->
  <g transform="translate(600 500)" filter="url(#shadow)">
    <path fill="url(#gearFill)" d="
      M 0 -295
      L  40 -270 L  65 -295  L 115 -275 L 115 -240
      L 180 -215 L 215 -230 L 250 -195 L 230 -165
      L 265 -115 L 300 -110 L 300  -45
      L 275   -5 L 300   45 L 300  110 L 265  115
      L 230  165 L 250  195 L 215  230 L 180  215
      L 115  240 L 115  275 L  65  295 L  40  270
      L   0  295 L -40  270 L -65  295 L -115 275 L -115 240
      L -180 215 L -215 230 L -250 195 L -230 165
      L -265 115 L -300 110 L -300  45
      L -275  -5 L -300 -45 L -300 -110 L -265 -115
      L -230 -165 L -250 -195 L -215 -230 L -180 -215
      L -115 -240 L -115 -275 L -65 -295 L -40 -270 Z"/>
    <circle cx="0" cy="0" r="105" fill="#2a1e52"/>
    <circle cx="0" cy="0" r="78" fill="url(#bg)"/>
  </g>

  <!-- Smaller gear, bottom-left -->
  <g transform="translate(340 680) rotate(15)" filter="url(#shadow)">
    <path fill="url(#gearFill2)" d="
      M 0 -180
      L  25 -165 L  45 -180 L  80 -170 L  80 -145
      L 115 -125 L 140 -135 L 160 -110 L 145  -90
      L 165  -55 L 185  -50 L 185   -20
      L 170    0 L 185   20 L 185   50 L 165   55
      L 145   90 L 160  110 L 140  135 L 115  125
      L  80  145 L  80  170 L  45  180 L  25  165
      L   0  180 L -25  165 L -45  180 L -80 170 L -80 145
      L -115 125 L -140 135 L -160 110 L -145  90
      L -165  55 L -185  50 L -185 -20
      L -170   0 L -185 -20 L -185 -50 L -165 -55
      L -145 -90 L -160 -110 L -140 -135 L -115 -125
      L -80 -145 L -80 -170 L -45 -180 L -25 -165 Z"/>
    <circle cx="0" cy="0" r="70" fill="#1b1f3a"/>
    <circle cx="0" cy="0" r="52" fill="url(#gearFill2)" opacity="0.3"/>
  </g>
</svg>
